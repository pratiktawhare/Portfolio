<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ml-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ml-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.90)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.75)"/>
    </linearGradient>
    <radialGradient id="ml-glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.25)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0)"/>
    </radialGradient>
    <radialGradient id="ml-glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.2)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#ml-bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="250" cy="200" r="350" fill="url(#ml-glow1)"/>
  <circle cx="1050" cy="520" r="400" fill="url(#ml-glow2)"/>

  <!-- Top App Header Mockup -->
  <rect x="80" y="50" width="1120" height="60" rx="16" fill="url(#ml-card)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="115" cy="80" r="6" fill="#ef4444"/>
  <circle cx="135" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="155" cy="80" r="6" fill="#10b981"/>

  <text x="190" y="86" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">MediLens <tspan fill="#06b6d4" font-weight="400">| Agentic Clinical AI &amp; Triage</tspan></text>
  <rect x="890" y="68" width="145" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="905" cy="81" r="4" fill="#10b981"/>
  <text x="918" y="85" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">LangGraph Active</text>

  <rect x="1050" y="68" width="130" height="26" rx="13" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
  <text x="1064" y="85" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">sub-100ms RAG</text>

  <!-- Left Sidebar / Stats -->
  <rect x="80" y="130" width="320" height="530" rx="20" fill="url(#ml-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="110" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">ROUTING &amp; KNOWLEDGE</text>

  <!-- Stat Box 1 -->
  <rect x="105" y="200" width="270" height="85" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="125" y="230" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">CLINICAL REFERENCE</text>
  <text x="125" y="258" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">3,688 Chunks</text>
  <text x="125" y="275" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11">637-page medical corpus in ChromaDB</text>

  <!-- Stat Box 2 -->
  <rect x="105" y="300" width="270" height="85" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="125" y="330" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">ROUTING THRESHOLD</text>
  <text x="125" y="358" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Confidence &gt; 0.60</text>
  <text x="125" y="375" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11">ChromaDB vs Tavily Live Search</text>

  <!-- Stat Box 3 -->
  <rect x="105" y="400" width="270" height="85" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="125" y="430" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">MULTIMODAL LATENCY</text>
  <text x="125" y="458" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">&lt; 50ms TTS</text>
  <text x="125" y="475" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Web Speech API + Groq Whisper</text>

  <!-- Tech tags -->
  <g transform="translate(105, 510)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)"/>
    <text x="40" y="16" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11">FastAPI</text>

    <rect x="90" y="0" width="80" height="24" rx="12" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)"/>
    <text x="130" y="16" text-anchor="middle" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif" font-size="11">React 19</text>

    <rect x="180" y="0" width="90" height="24" rx="12" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="225" y="16" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11">PostgreSQL</text>

    <rect x="0" y="32" width="125" height="24" rx="12" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)"/>
    <text x="62" y="48" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11">Neon Serverless</text>

    <rect x="135" y="32" width="135" height="24" rx="12" fill="rgba(244,63,94,0.15)" stroke="rgba(244,63,94,0.3)"/>
    <text x="202" y="48" text-anchor="middle" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Safety Guardrails</text>
  </g>

  <!-- Right: Agent Interactive Chat Window -->
  <rect x="420" y="130" width="780" height="530" rx="20" fill="url(#ml-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Agent Message Bubble 1 -->
  <rect x="450" y="160" width="720" height="120" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="470" y="175" width="105" height="22" rx="11" fill="rgba(6,182,212,0.2)"/>
  <text x="480" y="190" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">CLINICAL TRIAGE</text>
  <text x="590" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">LangGraph Routing Agent · Confidence: 0.94</text>
  <text x="470" y="225" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">"Patient presents with acute substernal chest discomfort radiating to left jaw."</text>
  <text x="470" y="255" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">✓ Emergency Protocol Activated · ChromaDB Source: Oxford Medical Handbook, p. 142</text>

  <!-- Agent Architecture Flow Diagram -->
  <g transform="translate(450, 300)">
    <rect x="0" y="0" width="720" height="210" rx="16" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.05)"/>
    
    <!-- Step 1: Input -->
    <rect x="30" y="70" width="120" height="70" rx="12" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="100" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">User Query</text>
    <text x="90" y="120" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="10">Voice / Vision / Text</text>

    <!-- Arrow 1 -->
    <path d="M 150 105 L 185 105" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Step 2: Router -->
    <rect x="185" y="55" width="155" height="100" rx="12" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="2"/>
    <text x="262" y="90" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">LangGraph Router</text>
    <text x="262" y="112" text-anchor="middle" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif" font-size="10">Confidence Gate (0.60)</text>
    <text x="262" y="132" text-anchor="middle" fill="#a5f3fc" font-family="system-ui, -apple-system, sans-serif" font-size="9">+ Guardrails &amp; Bypass</text>

    <!-- Branch Up: ChromaDB -->
    <path d="M 340 90 L 390 60" stroke="#10b981" stroke-width="2"/>
    <rect x="390" y="30" width="150" height="55" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="465" y="53" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">ChromaDB RAG</text>
    <text x="465" y="70" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9">3,688 Medical Chunks</text>

    <!-- Branch Down: Tavily Search -->
    <path d="M 340 120 L 390 150" stroke="#f59e0b" stroke-width="2"/>
    <rect x="390" y="125" width="150" height="55" rx="10" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="465" y="148" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Tavily Web Search</text>
    <text x="465" y="165" text-anchor="middle" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="9">Live Clinical Updates</text>

    <!-- Converge to Output -->
    <path d="M 540 60 L 580 90" stroke="#10b981" stroke-width="2"/>
    <path d="M 540 150 L 580 120" stroke="#f59e0b" stroke-width="2"/>

    <rect x="580" y="70" width="115" height="70" rx="12" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="637" y="100" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Triage Plan</text>
    <text x="637" y="120" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="9">Verified Citations</text>
  </g>

  <!-- Bottom query prompt input bar -->
  <rect x="450" y="535" width="720" height="50" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="480" y="565" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Ask clinical query, analyze medical document, or provide symptoms...</text>
  <rect x="1115" y="544" width="40" height="32" rx="8" fill="#06b6d4"/>
  <polygon points="1130,554 1144,560 1130,566" fill="#ffffff"/>
</svg>