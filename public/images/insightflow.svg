<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="if-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071a"/>
      <stop offset="50%" stop-color="#130a2a"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <linearGradient id="if-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="if-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(23, 15, 38, 0.90)"/>
      <stop offset="100%" stop-color="rgba(18, 10, 32, 0.75)"/>
    </linearGradient>
    <radialGradient id="if-glow1" cx="25%" cy="25%" r="45%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0)"/>
    </radialGradient>
    <radialGradient id="if-glow2" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.2)"/>
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0)"/>
    </radialGradient>
    <pattern id="if-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#if-bg)"/>
  <rect width="1280" height="720" fill="url(#if-grid)"/>
  <circle cx="250" cy="200" r="380" fill="url(#if-glow1)"/>
  <circle cx="1050" cy="520" r="420" fill="url(#if-glow2)"/>

  <!-- Top Header -->
  <rect x="80" y="50" width="1120" height="60" rx="16" fill="url(#if-card)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="115" cy="80" r="6" fill="#ef4444"/>
  <circle cx="135" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="155" cy="80" r="6" fill="#10b981"/>

  <text x="190" y="86" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">InsightFlow AI <tspan fill="#a855f7" font-weight="400">| Meeting &amp; Video RAG Intelligence</tspan></text>
  <rect x="890" y="68" width="150" height="26" rx="13" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="905" cy="81" r="4" fill="#8b5cf6"/>
  <text x="918" y="85" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">LangChain LCEL</text>

  <rect x="1055" y="68" width="125" height="26" rx="13" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1"/>
  <text x="1070" y="85" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Whisper + Sarvam</text>

