  <rect x="440" y="130" width="760" height="530" rx="20" fill="url(#if-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Video summary card -->
  <rect x="470" y="160" width="700" height="150" rx="16" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="490" y="180" width="130" height="24" rx="12" fill="rgba(139,92,246,0.2)"/>
  <text x="502" y="196" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">EXECUTIVE BRIEF</text>
  <text x="635" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Q3 All-Hands Engineering Meeting (48m 12s)</text>

  <text x="490" y="235" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Key Decisions &amp; Action Items Extracted:</text>
  <text x="490" y="262" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Microservices migration approved on AWS EC2 &amp; SQS queue pipeline.</text>
  <text x="490" y="284" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Replaced third-party transcription APIs with local Whisper + Sarvam AI.</text>

  <!-- Conversational RAG Question & Answer -->
  <rect x="470" y="330" width="700" height="175" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  
  <!-- User Question -->
  <rect x="490" y="350" width="44" height="20" rx="10" fill="rgba(59,130,246,0.2)"/>
  <text x="500" y="364" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">USER</text>
  <text x="548" y="365" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">What was the architectural decision regarding asynchronous queue workers?</text>

  <!-- AI Answer -->
  <line x1="490" y1="385" x2="1150" y2="385" stroke="rgba(255,255,255,0.05)"/>
  <rect x="490" y="400" width="80" height="20" rx="10" fill="rgba(168,85,247,0.2)"/>
  <text x="500" y="414" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">ASSISTANT</text>
  <text x="580" y="414" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">ChromaDB Timestamp: [24:18 - 25:04]</text>

  <text x="490" y="445" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13">"The team decided on AWS SQS with worker polling and merged SQL queries using asyncio.gather() to handle high-concurrency spikes without dropping tasks."</text>
  <text x="490" y="475" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">✓ Confidence: 98.7% · Vector Cosine Similarity: 0.92</text>

  <!-- Input bar -->
  <rect x="470" y="530" width="700" height="55" rx="14" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
  <text x="500" y="563" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Ask any question about this meeting or video transcript...</text>
  <rect x="1115" y="542" width="40" height="32" rx="8" fill="#8b5cf6"/>
  <polygon points="1130,552 1144,558 1130,564" fill="#ffffff"/>
</svg>