    <rect x="150" y="10" width="4" height="60" rx="2" fill="#a855f7"/>
    <rect x="160" y="26" width="4" height="28" rx="2" fill="#ec4899"/>
    <rect x="170" y="18" width="4" height="44" rx="2" fill="#8b5cf6"/>
    <rect x="180" y="28" width="4" height="24" rx="2" fill="#c084fc"/>
    <rect x="190" y="15" width="4" height="50" rx="2" fill="#ec4899"/>
    <rect x="200" y="25" width="4" height="30" rx="2" fill="#8b5cf6"/>
    <rect x="210" y="32" width="4" height="16" rx="2" fill="#a855f7"/>
    <rect x="220" y="18" width="4" height="44" rx="2" fill="#ec4899"/>
