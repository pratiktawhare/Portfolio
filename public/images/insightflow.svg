    <text x="20" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Local Whisper + Sarvam (Hinglish)</text>

    <rect x="0" y="75" width="280" height="60" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="101" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">2. VECTOR INDEXING</text>
    <text x="20" y="122" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">ChromaDB + HuggingFace Embeddings</text>

    <rect x="0" y="150" width="280" height="60" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
