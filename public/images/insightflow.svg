  <rect x="80" y="130" width="340" height="530" rx="20" fill="url(#if-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="110" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AUDIO &amp; SPEECH PIPELINE</text>

