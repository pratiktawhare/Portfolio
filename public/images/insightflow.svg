    <text x="20" y="197" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Mistral AI + LangChain LCEL Chains</text>

    <rect x="0" y="225" width="280" height="60" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="251" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">4. MEDIA EXTRACTION</text>
    <text x="20" y="272" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">FFmpeg Audio &amp; yt-dlp Video Stream</text>
